---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: slan-cuan-publish
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: Deploy
    tekton.dev/displayName: "slan-cuan: Publish to Pulp"
    tekton.dev/pipelines.minVersion: "0.50.0"
    tekton.dev/platforms: "linux/amd64"
    tekton.dev/tags: "release,maven,pulp,publish"
spec:
  description: >-
    Publish signed Java artifacts to Pulp repository for distribution.
  params:
    - name: PULP_URL
      description: Pulp instance base URL.
      type: string
    - name: PULP_REPOSITORY
      description: Pulp Maven distribution name.
      type: string
    - name: PULP_DOMAIN
      description: Pulp domain for hosted content API.
      type: string
      default: "lightwell"
    - name: INSECURE
      description: Disable TLS verification (true/false).
      type: string
      default: "false"
    - name: CA_CERT_SECRET
      description: K8s Secret name for custom CA cert (optional).
      type: string
      default: ""
    - name: CA_CERT_PATH
      description: Path to the CA certificate file inside the mounted secret.
      type: string
      default: ""
    - name: PULP_AUTH_TYPE
      description: Pulp authentication method (tbr or cert).
      type: string
      default: "tbr"
    - name: PULP_AUTH_SECRET
      description: >-
        K8s Secret name containing TBR credentials
        (keys: username, password).
      type: string
      default: ""
    - name: PULP_CERT_SECRET
      description: >-
        K8s Secret name containing client certificate for
        entitlement cert auth (keys: tls.crt, tls.key).
      type: string
      default: ""
    - name: PULP_USERNAME
      description: Username for pulp auth
      type: string
      default: ""
    - name: PULP_PASSWORD
      description: Password for pulp auth
      type: string
      default: ""
    - name: PULP_CLIENT_CERT_PATH
      description: Path to the client certificate file inside the mounted secret.
      type: string
      default: ""
    - name: PULP_CLIENT_KEY_PATH
      description: Path to the client key file inside the mounted secret.
      type: string
      default: ""
    - name: UPLOAD_WORKERS
      description: Number of concurrent upload threads.
      type: string
      default: "4"
    - name: REQUIRE_SUPPLY_CHAIN_METADATA
      description: When active the pipeline will fail if the SBOM + Provenance is not present in the build artifact.
      type: string
      default: "false"
    - name: PULP_FILE_REPOSITORY
      description: Pulp File repository name for security metadata (OSV/VEX) upload.
      type: string
      default: ""
    - name: PULP_TASK_TIMEOUT
      description: Maximum time in seconds to wait for asynchronous Pulp tasks.
      type: string
      default: "2700"
    - name: PULP_MAX_TOTAL_TASK_TIMEOUT
      description: >-
        Absolute maximum time in seconds across all Pulp task state and
        blocker timeout resets. Defaults to twice PULP_TASK_TIMEOUT.
      type: string
      default: ""
    - name: PULP_CUSTOM_HEADERS
      description: |
        Custom HTTP headers to send on repository modify requests
        (CRLF/newline-delimited 'Key: Value' lines or JSON object).
      type: string
      default: ""
    - name: GITHUB_OSV_REPO
      description: >-
        GitHub repository (owner/name) to publish OSV records to, in addition
        to Pulp. Leave empty to disable GitHub publication.
      type: string
      default: ""
    - name: GITHUB_OSV_TOKEN_SECRET
      description: >-
        Name of the Secret holding the GitHub token (key 'token') with write
        access to GITHUB_OSV_REPO. This is the Secret's name, not the token
        itself.
      type: string
      default: ""
    - name: GITHUB_OSV_BRANCH
      description: Branch of the OSV repository to commit records onto.
      type: string
      default: "main"
    - name: GITHUB_OSV_PATH
      description: >-
        Directory prefix inside the OSV repository for records. osv.dev
        ingests only this directory; empty means the repository root.
      type: string
      default: "advisories"
    - name: sourceDataArtifact
      description: Trusted Artifact URI of the extracted artifact directory from slan-cuan-extract.
      type: string
    - name: securityMetadataArtifact
      description: Optional Trusted Artifact URI containing security metadata.
      type: string
      default: ""
    - name: ociStorage
      description: The OCI repository where the Trusted Artifact is stored.
      type: string
      default: "empty"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls.
      type: string
      default: ""
    - name: caTrustConfigMapName
      description: The name of the ConfigMap to read CA bundle data from.
      type: string
      default: "trusted-ca"
    - name: caTrustConfigMapKey
      description: The name of the key in the ConfigMap that contains the CA bundle data.
      type: string
      default: "ca-bundle.crt"
    - name: catalogGitUrl
      description: The url to the git repo where the release-service-catalog stepactions are stored.
      type: string
      default: https://github.com/arewm/release-service-catalog.git
    - name: catalogGitRevision
      description: The revision in the catalogGitUrl repo to be used.
      type: string
      default: lightwell-pipeline
  results:
    - name: ARTIFACTS_UPLOADED
      description: Number of artifacts uploaded to Pulp.
    - name: ARTIFACTS_SKIPPED
      description: Number of artifacts skipped during upload.
    - name: PUBLISHED_ARTIFACT_OUTPUTS
      description: >-
        JSON object for Tekton Chains SLSA provenance.
        Contains uri and digest of the published artifacts.
      type: object
      properties:
        uri: {}
        digest: {}
    - name: PULP_LABELS
      description: >-
        JSON object with source_image label (fully qualified
        OCI reference) attached to each Pulp content unit.
    - name: SECURITY_METADATA_UPLOADED
      description: Number of security metadata files uploaded to the Pulp File repository.
    - name: SECURITY_METADATA_SKIPPED
      description: >-
        Number of security metadata files skipped because their OSV record type
        did not match the target Pulp File repository.
    - name: GITHUB_OSV_CONFIGURED
      description: >-
        "true" when GitHub OSV publication was configured for this run, "false"
        otherwise. Distinguishes an in-sync no-op (configured, 0 uploaded) from
        a run where GitHub publication was never enabled.
    - name: GITHUB_OSV_UPLOADED
      description: Number of OSV records pushed to the GitHub OSV repository.
    - name: GITHUB_OSV_COMMIT
      description: >-
        Commit SHA pushed to the GitHub OSV repository, or empty when GitHub
        publication was disabled or introduced no change.
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    securityContext:
      runAsNonRoot: true
      readOnlyRootFilesystem: false
    # env:
    #   - name: REQUESTS_CA_BUNDLE
    #     value: /etc/pki/tls/cert.pem
  steps:
    - name: use-trusted-artifact
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: /var/workdir/extracted
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caCertPath
          value: /mnt/trusted-ca/$(params.caTrustConfigMapKey)
    - name: use-security-metadata-artifact
      when:
        - input: $(params.securityMetadataArtifact)
          operator: notin
          values: [""]
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: /var/workdir/extracted/security_metadata
        - name: sourceDataArtifact
          value: $(params.securityMetadataArtifact)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caCertPath
          value: /mnt/trusted-ca/$(params.caTrustConfigMapKey)
    - name: run
      image: quay.io/light-castle/slan-cuan:latest
      imagePullPolicy: Always
      args:
        - --verbose
        - publish
      env:
        - name: SLAN_CUAN_CA_CERT
          value: $(params.CA_CERT_PATH)
        - name: SLAN_CUAN_PUBLISH_PULP_URL
          value: $(params.PULP_URL)
        - name: SLAN_CUAN_PUBLISH_PULP_REPOSITORY
          value: $(params.PULP_REPOSITORY)
        - name: SLAN_CUAN_PUBLISH_PULP_DOMAIN
          value: $(params.PULP_DOMAIN)
        - name: SLAN_CUAN_PUBLISH_ARTIFACT_DIR
          value: /var/workdir/extracted
        - name: SLAN_CUAN_PUBLISH_INSECURE
          value: $(params.INSECURE)
        - name: SLAN_CUAN_PUBLISH_PULP_AUTH_TYPE
          value: $(params.PULP_AUTH_TYPE)
        - name: SLAN_CUAN_PUBLISH_REQUIRE_SUPPLY_CHAIN_METADATA
          value: $(params.REQUIRE_SUPPLY_CHAIN_METADATA)
        - name: SLAN_CUAN_PUBLISH_PULP_FILE_REPOSITORY
          value: $(params.PULP_FILE_REPOSITORY)
        - name: SLAN_CUAN_PUBLISH_PULP_TASK_TIMEOUT
          value: $(params.PULP_TASK_TIMEOUT)
        - name: SLAN_CUAN_PUBLISH_PULP_MAX_TOTAL_TASK_TIMEOUT
          value: $(params.PULP_MAX_TOTAL_TASK_TIMEOUT)
        - name: SLAN_CUAN_PUBLISH_PULP_CUSTOM_HEADERS
          value: $(params.PULP_CUSTOM_HEADERS)
        - name: SLAN_CUAN_PUBLISH_GITHUB_OSV_REPO
          value: $(params.GITHUB_OSV_REPO)
        - name: SLAN_CUAN_PUBLISH_GITHUB_OSV_BRANCH
          value: $(params.GITHUB_OSV_BRANCH)
        - name: SLAN_CUAN_PUBLISH_GITHUB_OSV_PATH
          value: $(params.GITHUB_OSV_PATH)
        - name: SLAN_CUAN_PUBLISH_GITHUB_OSV_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.GITHUB_OSV_TOKEN_SECRET)
              key: token
              optional: true
        - name: SLAN_CUAN_PUBLISH_PULP_USERNAME
          valueFrom:
            secretKeyRef:
              name: $(params.PULP_USERNAME)
              key: username
              optional: true
        - name: SLAN_CUAN_PUBLISH_PULP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: $(params.PULP_PASSWORD)
              key: password
              optional: true
        - name: SLAN_CUAN_PUBLISH_PULP_CLIENT_CERT
          value: $(params.PULP_CLIENT_CERT_PATH)
        - name: SLAN_CUAN_PUBLISH_PULP_CLIENT_KEY
          value: $(params.PULP_CLIENT_KEY_PATH)
        - name: SLAN_CUAN_PUBLISH_UPLOAD_WORKERS
          value: $(params.UPLOAD_WORKERS)
        - name: SLAN_CUAN_TEKTON_RESULTS_DIR
          value: /tekton/results
      volumeMounts:
        - name: ca-cert
          mountPath: /certs
          readOnly: true
        - name: client-cert
          mountPath: /certs/client
          readOnly: true
  volumes:
    - name: workdir
      emptyDir: {}
    - name: ca-cert
      secret:
        secretName: $(params.CA_CERT_SECRET)
        optional: true
    - name: client-cert
      secret:
        secretName: $(params.PULP_CERT_SECRET)
        optional: true
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        optional: true
