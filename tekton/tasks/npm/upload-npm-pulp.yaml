---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: upload-npm-pulp
spec:
  description: |
    Upload npm package tarballs to a Pulp npm repository via the synchronous
    content upload API. Sets tl.compliance_level from adjacent
    *.tl-compliance.json sidecars when present. Idempotent: skips packages
    already present with matching sha256; fails if the same name/version
    exists with different content. On skip, still applies compliance labels
    (and best-effort sidecar upload to optional PULP_FILE_REPOSITORY) so
    reruns can correct metadata. Requires at least one .tgz under FILES_DIR.
    Business logic runs as a single plumbing-utils command (npm-release-upload)
  params:
    - name: SERVICE_ACCOUNT_SECRET_NAME
      type: string
      description: >-
        Secret with Pulp username/password keys (same as Python wheel release)
      default: rhtl-pulp-credentials-secret
    - name: PULP_BASE_URL
      type: string
      description: The base URL of the Pulp server
    - name: PULP_API_ROOT
      type: string
      description: The API root path of the Pulp server
      default: "/api/"
    - name: PULP_DOMAIN
      type: string
      description: The domain to use for Pulp operations
    - name: PULP_REPOSITORY
      type: string
      description: The Pulp npm repository to upload to
    - name: PULP_FILE_REPOSITORY
      type: string
      description: >
        Optional Pulp file repository for adjacent *.tl-compliance.json uploads.
        When empty, sidecar file uploads are skipped (compliance labels still apply)
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Trusted Artifact containing extracted npm packages
    - name: dataDir
      type: string
      description: The location where data will be stored
      default: /var/workdir/content
    - name: filesDir
      type: string
      description: The relative path within dataDir where package files are located
      default: files
    - name: ociArtifactExpiresAfter
      type: string
      description: Expiration date for the trusted artifacts created
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: caTrustConfigMapName
      description: The name of the ConfigMap to read CA bundle data from.
      type: string
      default: "trusted-ca"
    - name: caTrustConfigMapKey
      description: The name of the key in the ConfigMap that contains the CA bundle data.
      type: string
      default: "ca-bundle.crt"
    - name: catalogGitUrl
      type: string
      description: >-
        The url to the git repo where the release-service-catalog tasks and
        stepactions to be used are stored
      default: https://github.com/konflux-lightwell/release-service-catalog.git
    - name: catalogGitRevision
      type: string
      description: The revision in the catalogGitUrl repo to be used
      default: main
    - name: ociStorage
      type: string
      description: The OCI repository where the Trusted Artifacts are stored
  results:
    - description: Produced trusted data artifact
      name: sourceDataArtifact
      type: string
  volumes:
    - name: service-account-secret
      secret:
        secretName: $(params.SERVICE_ACCOUNT_SECRET_NAME)
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        optional: true
  stepTemplate:
    securityContext:
      runAsUser: 1001
    env:
      - name: PULP_BASE_URL
        value: $(params.PULP_BASE_URL)
      - name: PULP_API_ROOT
        value: $(params.PULP_API_ROOT)
      - name: PULP_DOMAIN
        value: $(params.PULP_DOMAIN)
      - name: PULP_REPOSITORY
        value: $(params.PULP_REPOSITORY)
      - name: PULP_FILE_REPOSITORY
        value: $(params.PULP_FILE_REPOSITORY)
      - name: FILES_DIR
        value: $(params.dataDir)/$(params.filesDir)
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    volumeMounts:
      - name: workdir
        mountPath: /var/workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 10m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caCertPath
          value: /mnt/trusted-ca/$(params.caTrustConfigMapKey)
    - name: upload
      image: quay.io/light-castle/slan-cuan:latest
      imagePullPolicy: Always
      volumeMounts:
        - name: service-account-secret
          mountPath: "/etc/service-account-secret"
          readOnly: true
      computeResources:
        limits:
          memory: 256Mi
        requests:
          memory: 256Mi
          cpu: 100m
      command: ["npm-release-upload"]
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.catalogGitUrl)"
          - name: revision
            value: "$(params.catalogGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caCertPath
          value: /mnt/trusted-ca/$(params.caTrustConfigMapKey)
