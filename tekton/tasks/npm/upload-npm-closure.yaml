---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: upload-npm-closure
spec:
  description: |
    Publish TL npm closure metadata after Pulp upload: for each assess
    *.tl-compliance.json sidecar under FILES_DIR, push per-package compliance
    OCI and update the global closure index on Quay (calunga-npm-registry-main).
    Quay refs are fixed for calunga-tenant; COMPLIANCE_IMAGE_PREFIX and
    CLOSURE_INDEX_IMAGE are set in stepTemplate env. Requires Pulp
    credentials (same secret as upload-npm-pulp). Business logic runs as a
    single plumbing-utils command (npm-release-closure-update).
  params:
    - name: SERVICE_ACCOUNT_SECRET_NAME
      type: string
      description: Secret with Pulp username/password keys (same as upload-npm-pulp)
      default: rhtl-pulp-credentials-secret
    - name: PULP_BASE_URL
      type: string
      description: The base URL of the Pulp server
    - name: PULP_API_ROOT
      type: string
      description: The API root path of the Pulp server
      default: "/api/"
    - name: PULP_DOMAIN
      type: string
      description: The domain to use for Pulp operations
    - name: PULP_REPOSITORY
      type: string
      description: The Pulp npm repository (for content href resolution)
    - name: sourceDataArtifact
      type: string
      description: Trusted Artifact containing extracted npm packages and sidecars
    - name: dataDir
      type: string
      description: The location where data will be stored
      default: /var/workdir/content
    - name: filesDir
      type: string
      description: The relative path within dataDir where package files are located
      default: files
    - name: ociArtifactExpiresAfter
      type: string
      description: Expiration date for the trusted artifacts created
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: caTrustConfigMapName
      description: The name of the ConfigMap to read CA bundle data from.
      type: string
      default: "trusted-ca"
    - name: caTrustConfigMapKey
      description: The name of the key in the ConfigMap that contains the CA bundle data.
      type: string
      default: "ca-bundle.crt"
    - name: catalogGitUrl
      type: string
      description: >-
        The url to the git repo where the release-service-catalog tasks and
        stepactions to be used are stored
      default: https://github.com/konflux-lightwell/release-service-catalog.git
    - name: catalogGitRevision
      type: string
      description: The revision in the catalogGitUrl repo to be used
      default: main
    - name: ociStorage
      type: string
      description: The OCI repository where the Trusted Artifacts are stored
  results:
    - description: Produced trusted data artifact
      name: sourceDataArtifact
      type: string
  volumes:
    - name: service-account-secret
      secret:
        secretName: $(params.SERVICE_ACCOUNT_SECRET_NAME)
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        optional: true
  stepTemplate:
    securityContext:
      runAsUser: 1001
    env:
      # Writable HOME so Tekton creds-init can copy SA dockerconfig secrets to
      # $HOME/.docker/config.json (select-oci-auth in plumbing-utils).
      - name: HOME
        value: /var/workdir
      - name: PULP_BASE_URL
        value: $(params.PULP_BASE_URL)
      - name: PULP_API_ROOT
        value: $(params.PULP_API_ROOT)
      - name: PULP_DOMAIN
        value: $(params.PULP_DOMAIN)
      - name: PULP_REPOSITORY
        value: $(params.PULP_REPOSITORY)
      - name: FILES_DIR
        value: $(params.dataDir)/$(params.filesDir)
      - name: COMPLIANCE_IMAGE_PREFIX
        value: quay.io/redhat-user-workloads/calunga-tenant/calunga-npm-registry-main
      - name: CLOSURE_INDEX_IMAGE
        value: quay.io/redhat-user-workloads/calunga-tenant/calunga-npm-registry-main:npm-closure-index
      - name: TL_NPM_REGISTRY_URL
        value: https://packages.redhat.com/api/pulp-content/public-trusted-libraries/javascript
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    volumeMounts:
      - name: workdir
        mountPath: /var/workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 10m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caCertPath
          value: /mnt/trusted-ca/$(params.caTrustConfigMapKey)
    - name: closure-update
      image: quay.io/light-castle/slan-cuan:latest
      imagePullPolicy: Always
      volumeMounts:
        - name: service-account-secret
          mountPath: "/etc/service-account-secret"
          readOnly: true
      computeResources:
        limits:
          memory: 512Mi
        requests:
          memory: 512Mi
          cpu: 100m
      command: ["npm-release-closure-update"]
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.catalogGitUrl)"
          - name: revision
            value: "$(params.catalogGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caCertPath
          value: /mnt/trusted-ca/$(params.caTrustConfigMapKey)
