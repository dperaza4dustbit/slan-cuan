---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: slan-cuan-extract-filter
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: Build
    tekton.dev/displayName: "slan-cuan: Extract and Filter Python Release Payload"
    tekton.dev/pipelines.minVersion: "0.50.0"
    tekton.dev/platforms: "linux/amd64"
    tekton.dev/tags: "release,python,extract,filtering,build-index"
spec:
  description: >-
    Extract a Python release payload from the component image and filter
    it against build-index purls in a single TaskRun, using
    `slan-cuan python extract-filter`. Reads the component images from
    the snapshot spec, pulls their distribution files into the payload
    directory, fetches the Tekton Chains SLSA provenance for each image
    (rh-sign-python-wheels consumes chains-provenance/ downstream to
    build PEP 740 attestations), and filters the payload: out-of-scope
    distribution files (wheels/sdists/sidecars) move to a filtered
    sibling directory while non-distribution content passes through
    untouched. Replaces the two-TaskRun extract-py-artifacts +
    build-index-filter chain; the populate-release-notes step is not
    ported (advisory creation was replaced by OSV creation and nothing
    in the release path consumes releaseNotes.content.artifacts).

    Remediated releases keep only distribution artifacts whose
    coordinates match index purls; validated releases can pass
    PUBLISH_ALL="true" to keep all artifacts. Release filtering requires
    exactly one component image; multi-component snapshots fail closed.

    Resolved directly by the calunga-push-to-pulp-lightwell managed
    pipeline (release-service-catalog) via its slanCuanGitUrl and
    slanCuanGitRevision params -- the same resolution pattern the java
    release flow uses for the other slan-cuan tasks. The input Trusted
    Artifact (the reduced snapshot) is restored under dataDir and the
    filtered payload is published as a new Trusted Artifact. Registry
    credentials for image pulls, provenance fetches, and referrer
    discovery are mounted from the REGISTRY_AUTH_SECRET Secret. The
    pipeline service account must be able to read the Chains public key
    secret referenced by PROVENANCE_KEY.
  params:
    - name: SNAPSHOT_PATH
      description: Path to the snapshot spec file (relative to dataDir) containing component image information.
      type: string
    - name: PAYLOAD_DIR
      description: Directory (under dataDir) to extract payload files into and filter.
      type: string
      default: /var/workdir/files
    - name: PUBLISH_ALL
      description: Publish all artifacts without filtering by build-index purls.
      type: string
      default: "false"
    - name: REGISTRY_AUTH_SECRET
      description: K8s Secret name for registry auth (.dockerconfigjson format).
      type: string
      default: "registry-auth"
    - name: PROVENANCE_KEY
      description: cosign key reference for verifying Tekton Chains attestations.
      type: string
      default: "k8s://openshift-pipelines/public-key"
    - name: dataDir
      description: The location where data will be stored.
      type: string
      default: /var/workdir
    - name: sourceDataArtifact
      description: Trusted Artifact URI containing the reduced snapshot spec.
      type: string
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifact in the OCI repository.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls.
      type: string
      default: ""
    - name: caTrustConfigMapName
      description: The name of the ConfigMap to read CA bundle data from.
      type: string
      default: "trusted-ca"
    - name: caTrustConfigMapKey
      description: The name of the key in the ConfigMap that contains the CA bundle data.
      type: string
      default: "ca-bundle.crt"
    - name: catalogGitUrl
      description: The url to the git repo where the release-service-catalog stepactions are stored.
      type: string
      default: https://github.com/konflux-lightwell/release-service-catalog.git
    - name: catalogGitRevision
      description: The revision in the catalogGitUrl repo to be used.
      type: string
      default: main
  results:
    - name: CONSUMED_BUILD_INDEX_DIGEST
      description: Sha256 digest of the consumed build-index.json referrer.
    - name: KEPT_COUNT
      description: Count of payload files kept after filtering.
    - name: REMOVED_COUNT
      description: Count of payload files removed to the filtered sibling directory.
    - name: sourceDataArtifact
      description: Trusted Artifact URI containing the extracted and filtered payload directory.
      type: string
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    securityContext:
      runAsNonRoot: true
      readOnlyRootFilesystem: false
  steps:
    - name: use-trusted-artifact
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caCertPath
          value: /mnt/trusted-ca/$(params.caTrustConfigMapKey)
    - name: run
      # Re-pin to an immutable @sha256: digest once the slan-cuan release
      # containing python extract-filter ships.
      image: quay.io/light-castle/slan-cuan:latest
      imagePullPolicy: Always
      args:
        - python
        - extract-filter
      env:
        - name: SLAN_CUAN_PYTHON_EXTRACT_FILTER_SNAPSHOT_PATH
          value: $(params.dataDir)/$(params.SNAPSHOT_PATH)
        - name: SLAN_CUAN_PYTHON_EXTRACT_FILTER_FILES_DIR
          value: $(params.PAYLOAD_DIR)
        - name: SLAN_CUAN_PYTHON_EXTRACT_FILTER_PUBLISH_ALL
          value: $(params.PUBLISH_ALL)
        - name: SLAN_CUAN_PYTHON_EXTRACT_FILTER_REGISTRY_AUTH_FILE
          value: /auth/.dockerconfigjson
        - name: SLAN_CUAN_PYTHON_EXTRACT_FILTER_PROVENANCE_KEY
          value: $(params.PROVENANCE_KEY)
        - name: SLAN_CUAN_TEKTON_RESULTS_DIR
          value: /tekton/results
      volumeMounts:
        - name: registry-auth
          mountPath: /auth
          readOnly: true
    - name: create-trusted-artifact
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caCertPath
          value: /mnt/trusted-ca/$(params.caTrustConfigMapKey)
  volumes:
    - name: workdir
      emptyDir: {}
    - name: registry-auth
      secret:
        secretName: $(params.REGISTRY_AUTH_SECRET)
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        optional: true
