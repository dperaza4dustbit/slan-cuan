#
# Build System — PEP 517/518 backend configuration
#

[build-system]
requires = ["setuptools >= 68.0", "wheel >= 0.41.0"]
build-backend = "setuptools.build_meta"

#
# Project Metadata — PEP 621 package definition
#

[project]
name = "slan-cuan"
version = "0.1.0"
description = "Release pipeline for Red Hat Lightwell Java artifacts"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Red Hat Lightwell" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click >= 8.1",
    "defusedxml >= 0.7.0",
    "fath-cuan >= 0.6.0",
    "httpx >= 0.27",
    "mmh3",
    "packageurl-python",
]

[project.scripts]
slan-cuan = "slan_cuan.cli:main"

[project.optional-dependencies]
kerberos = ["krbticket>=0.1.0", "requests>=2.28.0", "requests-gssapi>=1.2.0"]
dev = ["ruff", "pytest", "poethepoet", "pyyaml"]

#
# Setuptools — package discovery
#

[tool.setuptools.packages.find]
include = ["slan_cuan*"]

#
# Ruff — linter and formatter
#

[tool.ruff]
line-length = 82
exclude = ["docs/**", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "TID", "T10"]
ignore = ["D203", "D213"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

#
# Pytest — test runner
#

[tool.pytest.ini_options]
testpaths = ["slan_cuan", "tests"]
python_files = ["*_test.py"]
addopts = ["--import-mode=importlib"]
pythonpath = ["vendor/release-service-utils/scripts/python/helpers"]
markers = ["functional: runs against a real Pulp instance (requires env vars)"]

#
# Poe the Poet — task runner
#

[tool.poe.tasks]
lint = "ruff check ."
format-fix = "ruff check --fix ."
format-check = "ruff format --check ."
fmt = "ruff format ."

[tool.poe.tasks.test-unit]
help = "run unit tests"
shell = "pytest; rc=$?; [ $rc -eq 5 ] && exit 0 || exit $rc"

[tool.poe.tasks.cli]
help = "run the slan-cuan CLI"
cmd = "python -m slan_cuan.cli"

[tool.poe.tasks.check]
help = "run all CI checks (lint, format, unit tests)"
sequence = ["lint", "format-check", "test-unit"]

[tool.poe.tasks.update-fixture]
help = "refresh the vendored release-service-catalog pipeline fixture"
cmd = "python scripts/update_pipeline_fixture.py"
